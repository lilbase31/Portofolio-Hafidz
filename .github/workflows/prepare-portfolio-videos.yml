name: Prepare portfolio videos

on:
  push:
    branches:
      - preview/portfolio-materials
    paths:
      - .github/workflows/prepare-portfolio-videos.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-videos:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/portfolio-materials
          fetch-depth: 0

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --user gdown

      - name: Download, optimize, and create posters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/videos assets/posters /tmp/portfolio-videos

          cat > /tmp/video-map.txt <<'MAP'
          1zGKv3e3k9gcCoQSAg3csyCT3EBRRmq5S|cinematic-01
          1UQwM5aBQyQOPp3zsp4mGKUtMxTd270Gc|cinematic-02
          1Usdw73K5qjz1PmRc8VMZI2sbsJ1cch0s|cinematic-03
          1Yx4OY2rR06iUW_K9aYX1jUon16vKRfkL|cinematic-04
          12sKgjLqcJw02IyoluUz4ymBYj3WgaJar|cinematic-05
          1zZggCyHziGGcUZ5e6wO0cZvsMNalUXiD|talkinghead-01
          1sbPgKLf0S7XK_3-yjUac06rknY_4Xt4B|talkinghead-02
          1D-UJkt0U04TXoFXX7X0ENyTxr8Jjy8g1|talkinghead-03
          1WqYzpJJv7eCDA1TUnA-h0v3_fUr40O6B|talkinghead-04
          1-_2g2mMDuVGNvA4ttxz0Ie0rX_UzFw0o|talkinghead-05
          MAP

          while IFS='|' read -r file_id slug; do
            echo "Processing $slug"
            src="/tmp/portfolio-videos/${slug}-source.mp4"
            out="assets/videos/${slug}.mp4"
            poster="assets/posters/${slug}.jpg"

            python3 -m gdown "https://drive.google.com/uc?id=${file_id}" -O "${src}"

            ffmpeg -hide_banner -loglevel error -y \
              -i "${src}" \
              -map 0:v:0 -map 0:a? \
              -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p \
              -c:a aac -b:a 128k \
              -movflags +faststart \
              "${out}"

            ffmpeg -hide_banner -loglevel error -y \
              -ss 1 -i "${out}" -frames:v 1 -q:v 3 "${poster}"
          done < /tmp/video-map.txt

          oversized="$(find assets/videos -type f -size +95M -print -quit)"
          if [ -n "${oversized}" ]; then
            echo "Video still exceeds safe GitHub file size: ${oversized}"
            exit 1
          fi

      - name: Commit optimized website assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/videos assets/posters
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Add optimized portfolio video assets [skip ci]"
          git push origin HEAD:preview/portfolio-materials
